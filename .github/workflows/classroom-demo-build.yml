name: Classroom demo builds
on:
  push:
    branches: [ci/classroom-demo-2703]
permissions:
  contents: read
env:
  FLUTTER_VERSION: '3.47.7'
jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      VERSION: 0.1.0-rc.2026112703
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a4ecbdff65e3c2936d8ca8b658653178b3d7804a
      - uses: actions/setup-go@v7
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build
        run: |
          (cd daemon && CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X github.com/walkerkiller/coursive/daemon/internal/server.Version=$VERSION" -o bin/coursive-daemon.exe ./cmd/coursive-daemon)
          (cd app && flutter pub get && flutter build windows --release --build-name '0.1.0' --build-number '2026112703')

      - name: Stage
        run: |
          stage=app/build/windows/x64/runner/Release
          cp daemon/bin/coursive-daemon.exe "$stage/"
          mkdir -p "$stage/agent"
          cp -r agent/src agent/plugins agent/package.json agent/package-lock.json "$stage/agent/"
          (cd "$stage/agent" && npm ci --omit=dev)
          daemon/bin/coursive-daemon.exe prune "$stage/agent/node_modules"
          cp LICENSE "$stage/"

      - name: Package PDF reader
        shell: pwsh
        run: |
          $stage = Resolve-Path app/build/windows/x64/runner/Release
          ./scripts/desktop/pack-windows-pdf.ps1 -Destination "$stage/pdf-notes"

      - name: Package
        shell: pwsh
        run: |
          $name = "coursive-$env:VERSION-windows-x64"
          $stage = Resolve-Path app/build/windows/x64/runner/Release
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\$name.zip"
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DSourceDir=$stage" "/DOutputDir=$(Resolve-Path dist)" "/DOutputName=$name-setup" app/windows/packaging/coursive.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: coursive-windows-x64
          path: dist/*
          retention-days: 14

  macos:
    name: macOS universal
    runs-on: macos-latest
    env:
      VERSION: 0.1.0-rc.2026112703
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a4ecbdff65e3c2936d8ca8b658653178b3d7804a
      - uses: actions/setup-go@v7
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        run: |
          cd daemon
          for a in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$a go build -trimpath -ldflags="-s -w -X github.com/walkerkiller/coursive/daemon/internal/server.Version=$VERSION" -o "bin/coursive-daemon-$a" ./cmd/coursive-daemon
          done
          lipo -create -output bin/coursive-daemon bin/coursive-daemon-arm64 bin/coursive-daemon-amd64
          for a in arm64 x86_64; do
            xcrun swiftc -O -target "$a-apple-macosx11.0" ../scripts/desktop/study-pdf.swift -o "bin/coursive-study-pdf-$a"
          done
          lipo -create -output bin/coursive-study-pdf bin/coursive-study-pdf-arm64 bin/coursive-study-pdf-x86_64
          lipo bin/coursive-study-pdf -verify_arch arm64 x86_64
          for a in arm64 x86_64; do
            xcrun swiftc -O -target "$a-apple-macosx11.0" ../scripts/desktop/pdf-notes-render.swift -o "bin/coursive-pdf-notes-render-$a"
          done
          lipo -create -output bin/coursive-pdf-notes-render bin/coursive-pdf-notes-render-arm64 bin/coursive-pdf-notes-render-x86_64
          lipo bin/coursive-pdf-notes-render -verify_arch arm64 x86_64
          cd ../app
          flutter pub get
          flutter build macos --release --build-name '0.1.0' --build-number '2026112703'

      # Not notarized: the app is signed ad hoc after the daemon and the agent
      # are added, so it runs once the user allows it (see the README).
      - name: Stage and sign
        run: |
          app="app/build/macos/Build/Products/Release/Coursive.app"
          res="$app/Contents/Resources"
          # The daemon is code and sits beside the executable; the agent is data.
          cp daemon/bin/coursive-daemon daemon/bin/coursive-study-pdf "$app/Contents/MacOS/"
          test -x "$app/Contents/MacOS/coursive-study-pdf"
          mkdir -p "$res/agent"
          cp -r agent/src agent/plugins agent/package.json agent/package-lock.json "$res/agent/"
          (cd "$res/agent" && npm ci --omit=dev)
          daemon/bin/coursive-daemon prune "$res/agent/node_modules"
          mkdir -p "$res/pdf-notes"
          python3 -m venv "$RUNNER_TEMP/pdf-notes-venv"
          "$RUNNER_TEMP/pdf-notes-venv/bin/python" -m pip install -r scripts/desktop/pdf-notes-requirements.txt
          "$RUNNER_TEMP/pdf-notes-venv/bin/python" scripts/desktop/build-pdf-notes.py "$res/pdf-notes/coursive-pdf-notes"
          cp daemon/bin/coursive-pdf-notes-render "$res/pdf-notes/"
          test -x "$res/pdf-notes/coursive-pdf-notes"
          cp LICENSE "$res/"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Package
        run: |
          name="coursive-$VERSION-macos-universal"
          mkdir -p dist dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Coursive" -srcfolder dmg -fs HFS+ -format UDZO "dist/$name.dmg"
          ditto -c -k --keepParent "$APP" "dist/$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: coursive-macos-universal
          path: dist/*
          retention-days: 14

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.0-rc.2026112703
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a4ecbdff65e3c2936d8ca8b658653178b3d7804a
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v7
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Native programs
        run: python3 app/android/workspace/prepare.py --abi arm64-v8a,x86_64 --version "$VERSION"

      # Without the secrets the APKs carry a throwaway debug signature, and
      # installing the next release needs an uninstall (which deletes data).
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APKs are signed with a debug key."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "${KEY_PASSWORD:-$STORE_PASSWORD}" > app/android/key.properties

      - name: Build
        run: |
          cd app
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 \
            --obfuscate --split-debug-info=build/symbols \
            --build-name '0.1.0' --build-number '2026112703'
          mkdir -p ../dist
          for abi in arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../dist/coursive-$VERSION-android-$abi.apk"
          done
          rm -f android/key.properties

      - uses: actions/upload-artifact@v7
        with:
          name: coursive-android
          path: dist/*
          retention-days: 14
      # Needed to read crash stack traces of the obfuscated build.
      - uses: actions/upload-artifact@v7
        with:
          name: coursive-android-symbols
          path: app/build/symbols
          retention-days: 90
